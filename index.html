<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Benicio Poli Games ⭐</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900;1000&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#6edff6;--sky2:#1a8fc8;
  --card:#fff;--card2:#edf8ff;
  --ink:#1a2c4e;--ink2:#3a6080;
  --green:#27c472;--red:#ff4757;
  --orange:#ff8c00;--yellow:#ffd32a;
  --purple:#a55eea;--pink:#ff6b9d;
  --shadow:0 14px 36px rgba(0,0,0,.18);
  --radius:28px;
  --font:'Nunito',sans-serif;
  --display:'Fredoka One',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}

body{
  font-family:var(--font);
  background:linear-gradient(160deg,#74e1f7 0%,#1a9ad7 60%,#0d6fab 100%);
  min-height:100vh;overflow-x:hidden;position:relative;
}

/* Animated clouds */
.clouds{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:rgba(255,255,255,.22);border-radius:999px;animation:drift linear infinite}
.c1{width:240px;height:65px;top:5%;left:-60px;animation-duration:22s}
.c2{width:180px;height:50px;top:18%;right:-40px;animation-duration:28s;animation-direction:reverse}
.c3{width:140px;height:40px;top:48%;left:5%;animation-duration:19s;animation-delay:3s}
.c4{width:100px;height:30px;top:70%;right:8%;animation-duration:25s;animation-delay:6s}
@keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(50px)}100%{transform:translateX(0)}}

/* Stars */
.star{position:fixed;width:6px;height:6px;background:#fff;border-radius:50%;opacity:0;animation:twinkle ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.7;transform:scale(1)}}

.screen{display:none;min-height:100vh;padding:16px;position:relative;z-index:1}
.active{display:block}

/* ── HOME ── */
#home{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center}
#home.active{display:flex}
.home-title{font-family:var(--display);font-size:38px;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.25);margin-bottom:4px;letter-spacing:1px}
.home-sub{font-size:18px;color:rgba(255,255,255,.9);margin-bottom:28px;font-weight:700}
.home-card{background:var(--card);border-radius:32px;padding:28px 24px 24px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.22);position:relative;overflow:hidden}
.home-card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--orange),var(--yellow),var(--green),var(--sky2));border-radius:32px 32px 0 0}

/* Photo circle */
.benicio-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center top;border:5px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.2);display:block;margin:0 auto 12px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.home-greeting{font-family:var(--display);font-size:26px;color:var(--ink);margin-bottom:4px}
.home-hint{font-size:15px;color:var(--ink2);margin-bottom:20px}
.start-btn{
  background:linear-gradient(135deg,var(--orange) 0%,#ff6500 100%);
  color:#fff;border:0;border-radius:22px;padding:18px 48px;font-size:22px;
  font-family:var(--display);box-shadow:0 8px 0 #c84a00;cursor:pointer;
  transition:transform .1s,box-shadow .1s;letter-spacing:.5px;display:block;width:100%;
}
.start-btn:active{transform:translateY(5px);box-shadow:0 3px 0 #c84a00}

/* ── TOPBAR ── */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:560px;margin:0 auto 12px}
.topbar-btn{border:0;border-radius:18px;padding:10px 14px;font-size:15px;font-weight:800;font-family:var(--font);background:rgba(255,255,255,.92);color:var(--ink2);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s}
.topbar-btn:active{transform:translateY(3px)}
.score-pill{font-family:var(--display);font-size:20px;background:rgba(255,255,255,.92);border-radius:18px;padding:10px 18px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.12)}

/* ── MENU ── */
#menu .page-title{font-family:var(--display);font-size:30px;color:#fff;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.2);margin-bottom:14px}

/* Mini photo in menu */
.mini-photo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.mini-photo{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.mini-greeting{font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.2)}

.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:0 auto}
.menu-btn{border:0;border-radius:22px;padding:18px 10px 14px;background:var(--card);color:var(--ink);font-weight:900;font-family:var(--font);font-size:18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;overflow:hidden}
.menu-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px}
.menu-btn:nth-child(1)::after{background:var(--orange)}
.menu-btn:nth-child(2)::after{background:var(--sky2)}
.menu-btn:nth-child(3)::after{background:var(--yellow)}
.menu-btn:nth-child(4)::after{background:var(--green)}
.menu-btn:nth-child(5)::after{background:var(--purple)}
.menu-btn:nth-child(6)::after{background:var(--pink)}
.menu-btn:nth-child(7)::after{background:#ff4757}
.menu-btn:nth-child(8)::after{background:#2ed573}
.menu-btn:active{transform:scale(.95)}
.micon{font-size:46px;line-height:1}
.mlabel{color:var(--ink2);font-size:15px;font-weight:800}

/* ── GAME ── */
#instruction{font-family:var(--display);font-size:26px;color:#fff;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.22);margin:6px auto 12px;max-width:520px;min-height:40px;letter-spacing:.2px}
#gameArea{background:var(--card);border-radius:var(--radius);min-height:50vh;max-width:560px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:center;justify-items:center;box-shadow:var(--shadow)}
.tile{width:100%;min-height:115px;border-radius:22px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:50px;font-weight:900;box-shadow:0 7px 0 #c0dff7;cursor:pointer;user-select:none;transition:transform .12s;position:relative;overflow:hidden;border:2.5px solid rgba(4,120,180,.08)}
.tile:active{transform:scale(.93)}
.tlabel{font-size:15px;margin-top:5px;color:var(--ink2);font-weight:800;font-family:var(--font)}
.colorBall{width:78px;height:78px;border-radius:50%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.15)}

.tile.success{animation:pop .35s ease;border-color:var(--green)}
.tile.wrong-ans{animation:shake .35s ease;border-color:var(--red)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* feedback */
.fb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:100}
.fb-bubble{font-size:90px;opacity:0;animation:popBig .5s ease forwards}
@keyframes popBig{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:1}}

/* confetti */
.conf{position:fixed;top:-16px;border-radius:4px;animation:fall 1.5s linear forwards;z-index:200}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}

/* end screen */
.end-card{background:var(--card);border-radius:32px;padding:32px 24px;max-width:400px;margin:20px auto;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.end-card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--orange),var(--yellow),var(--green))}
.end-photo{width:90px;height:90px;border-radius:50%;object-fit:cover;object-position:center top;border:4px solid #fff;box-shadow:0 5px 16px rgba(0,0,0,.18);display:block;margin:0 auto 10px}
.end-icon{font-size:72px;display:block;margin-bottom:8px}
.end-title{font-family:var(--display);font-size:28px;color:var(--ink);margin-bottom:6px}
.end-sub{font-size:16px;color:var(--ink2);margin-bottom:22px}
.end-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.end-btn{border:0;border-radius:20px;padding:14px 26px;font-size:17px;font-weight:900;font-family:var(--font);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .1s}
.end-btn:active{transform:translateY(4px)}
.btn-again{background:linear-gradient(135deg,var(--orange),#ff5e00);color:#fff}
.btn-menu{background:var(--card2);color:var(--ink2)}

@media(min-width:600px){
  #gameArea{grid-template-columns:repeat(3,1fr)}
  .tile{min-height:125px}
}
</style>
</head>
<body>
<div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div></div>
<div id="starContainer"></div>

<!-- HOME -->
<section id="home" class="screen">
  <div class="home-title">🌟 Benicio Poli Games</div>
  <div class="home-sub">Aprendendo e se divertindo!</div>
  <div class="home-card">
    <img class="benicio-photo" id="homePhoto" src="" alt="Benício" />
    <div class="home-greeting">Olá, Benício! 👋</div>
    <div class="home-hint">Toque para começar a brincar</div>
    <button class="start-btn" onclick="goMenu()">▶ Começar!</button>
  </div>
</section>

<!-- MENU -->
<section id="menu" class="screen">
  <div class="topbar">
    <button class="topbar-btn" onclick="toggleLang()">🌐 PT/EN</button>
    <div class="score-pill" id="scoreBox">⭐ 0</div>
    <button class="topbar-btn" onclick="goHome()">🏠</button>
  </div>
  <div class="mini-photo-row">
    <img class="mini-photo" id="menuPhoto" src="" alt="Benício"/>
    <span class="mini-greeting" id="menuGreet">Escolha uma brincadeira!</span>
  </div>
  <div class="menu-grid">
    <button class="menu-btn" onclick="playExplore('colors')"><span class="micon">🎨</span><span class="mlabel">Cores</span></button>
    <button class="menu-btn" onclick="playExplore('numbers')"><span class="micon">🔢</span><span class="mlabel">Números</span></button>
    <button class="menu-btn" onclick="playExplore('letters')"><span class="micon">🔤</span><span class="mlabel">Letras</span></button>
    <button class="menu-btn" onclick="playExplore('shapes')"><span class="micon">🔺</span><span class="mlabel">Formas</span></button>
    <button class="menu-btn" onclick="playVehicles()"><span class="micon">🚒</span><span class="mlabel">Veículos</span></button>
    <button class="menu-btn" onclick="playExplore('fruits')"><span class="micon">🍎</span><span class="mlabel">Frutas</span></button>
    <button class="menu-btn" onclick="playExplore('veggies')"><span class="micon">🥦</span><span class="mlabel">Verduras</span></button>
    <button class="menu-btn" onclick="startChallenge()"><span class="micon">🎯</span><span class="mlabel">Desafio</span></button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="topbar-btn" onclick="goMenu()">⬅ Voltar</button>
    <div class="score-pill" id="scoreBox2">⭐ 0</div>
    <button class="topbar-btn" onclick="repeatVoice()">🔊</button>
  </div>
  <div id="instruction"></div>
  <div id="gameArea"></div>
</section>

<!-- END -->
<section id="end" class="screen">
  <div class="topbar"><div style="flex:1"></div><div class="score-pill" id="scoreBox3">⭐ 0</div><div style="flex:1"></div></div>
  <div class="end-card">
    <img class="end-photo" id="endPhoto" src="" alt="Benício"/>
    <span class="end-icon" id="endIcon">🏆</span>
    <div class="end-title" id="endTitle">Parabéns!</div>
    <div class="end-sub" id="endSub">Você foi incrível!</div>
    <div class="end-btns">
      <button class="end-btn btn-again" onclick="replayChallenge()">🔄 De novo</button>
      <button class="end-btn btn-menu" onclick="goMenu()">🏠 Menu</button>
    </div>
  </div>
</section>

let lang='pt', score=0, lastSpeech='', challengeMode='', challengeQ=0, challengeTotal=8, challengeCorrect=0, replayFn=null;
let challengePool=[];

const $=id=>document.getElementById(id);
const nameOf=obj=>lang==='pt'?obj.pt:obj.en;
const rand=arr=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function updateScore(){['scoreBox','scoreBox2','scoreBox3'].forEach(id=>{const e=$(id);if(e)e.textContent='⭐ '+score})}
function goHome(){show('home');speak('Benicio Poli Games')}
function goMenu(){show('menu');updateScore();const t=lang==='pt'?'Escolha uma brincadeira':'Choose a game';$('menuGreet').textContent=t;speak(t)}
function toggleLang(){lang=lang==='pt'?'en':'pt';speak(lang==='pt'?'Português':'English');goMenu()}
function speak(text){lastSpeech=text;speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(text);m.lang=lang==='pt'?'pt-BR':'en-US';m.rate=.82;m.pitch=1.1;speechSynthesis.speak(m)}
function repeatVoice(){if(lastSpeech)speak(lastSpeech)}
function clearGame(){$('gameArea').innerHTML='';$('instruction').textContent=''}

function showFeedback(emoji){
  const ov=$('fbOverlay'),bub=$('fbBubble');
  bub.textContent=emoji;bub.style.animation='none';
  ov.style.opacity='1';void bub.offsetWidth;
  bub.style.animation='popBig .5s ease forwards';
  setTimeout(()=>ov.style.opacity='0',900);
}

function confetti(){
  const clrs=['#ff8c00','#27c472','#1e90ff','#ff4757','#a55eea','#ffd32a','#ff6b9d'];
  for(let i=0;i<45;i++){
    const c=document.createElement('div');c.className='conf';
    c.style.left=Math.random()*100+'vw';
    c.style.background=clrs[Math.floor(Math.random()*clrs.length)];
    c.style.animationDelay=Math.random()*.3+'s';
    c.style.width=(7+Math.random()*8)+'px';c.style.height=(11+Math.random()*12)+'px';
    document.body.appendChild(c);setTimeout(()=>c.remove(),1700);
  }
}

// ── EXPLORE ──
function playExplore(mode){
  show('game');clearGame();
  const titles={
    colors:['Toque em uma cor!','Touch a color!'],
    numbers:['Toque em um número!','Touch a number!'],
    letters:['Toque em uma letra!','Touch a letter!'],
    shapes:['Toque em uma forma!','Touch a shape!'],
    fruits:['Toque em uma fruta!','Touch a fruit!'],
    veggies:['Toque em uma verdura!','Touch a vegetable!'],
  };
  const [ptT,enT]=titles[mode];
  const instr=lang==='pt'?ptT:enT;
  $('instruction').textContent=instr;speak(instr);
  const list=mode==='colors'?colors:mode==='numbers'?numbers:mode==='letters'?letters:mode==='shapes'?shapes:mode==='fruits'?fruits:veggies;
  list.forEach(obj=>addExploreTile(obj,mode));
}
function addExploreTile(obj,mode){
  const t=document.createElement('div');t.className='tile';
  if(mode==='colors'){t.innerHTML=`<div class="colorBall" style="background:${obj.css}"></div><div class="tlabel">${nameOf(obj)}</div>`}
  else if(['shapes','fruits','veggies','vehicles'].includes(mode)){t.innerHTML=`<span style="font-size:54px">${obj.emoji}</span><div class="tlabel">${nameOf(obj)}</div>`}
  else{t.innerHTML=`<span>${obj.value||obj.pt}</span>`}
  t.onclick=()=>{speak(nameOf(obj));t.classList.add('success');setTimeout(()=>t.classList.remove('success'),380);showFeedback('✨')}
  $('gameArea').appendChild(t);
}

// ── VEHICLES EXPLORE ──
function playVehicles(){
  show('game');clearGame();
  const instr=lang==='pt'?'Toque nos veículos!':'Touch the vehicles!';
  $('instruction').textContent=instr;speak(instr);
  shuffle(vehicles).slice(0,12).forEach(v=>{
    const t=document.createElement('div');t.className='tile';
    t.innerHTML=`<span style="font-size:54px">${v.emoji}</span><div class="tlabel">${nameOf(v)}</div>`;
    t.onclick=()=>{speak(nameOf(v));t.classList.add('success');setTimeout(()=>t.classList.remove('success'),380);showFeedback('🚀')}
    $('gameArea').appendChild(t);
  });
}

// ── CHALLENGE ──
function getPool(mode){
  if(mode==='colors')return colors;
  if(mode==='numbers')return numbers.slice(0,10);
  if(mode==='letters')return letters;
  if(mode==='shapes')return shapes;
  if(mode==='vehicles')return vehicles;
  if(mode==='fruits')return fruits;
  if(mode==='veggies')return veggies;
  return colors;
}
function startChallenge(){
  challengeQ=0;challengeCorrect=0;
  const cats=['colors','numbers','letters','shapes','vehicles','fruits','veggies'];
  challengeMode=rand(cats);
  challengePool=getPool(challengeMode);
  replayFn=startChallenge;
  nextChallengeQ();
}
function replayChallenge(){if(replayFn)replayFn()}
function nextChallengeQ(){
  if(challengeQ>=challengeTotal){showEnd();return}
  show('game');clearGame();challengeQ++;
  const pool=shuffle(challengePool);
  const target_=pool[0];
  window._target=target_;
  const choices=pool.slice(0,6);
  const askLabels={colors:['Ache a cor','Find the color'],numbers:['Ache o número','Find the number'],letters:['Ache a letra','Find the letter'],shapes:['Ache a forma','Find the shape'],vehicles:['Ache o veículo','Find the vehicle'],fruits:['Ache a fruta','Find the fruit'],veggies:['Ache a verdura','Find the vegetable']};
  const [ptA,enA]=askLabels[challengeMode];
  const phrase=`${lang==='pt'?ptA:enA}: ${nameOf(target_)}`;
  $('instruction').textContent=phrase;speak(phrase);
  choices.forEach(obj=>{
    const t=document.createElement('div');t.className='tile';
    if(challengeMode==='colors'){t.innerHTML=`<div class="colorBall" style="background:${obj.css}"></div>`}
    else if(['shapes','vehicles','fruits','veggies'].includes(challengeMode)){t.innerHTML=`<span style="font-size:54px">${obj.emoji}</span>`}
    else{t.innerHTML=`<span>${obj.value||obj.pt}</span>`}
    t.onclick=()=>checkAnswer(obj,t);
    $('gameArea').appendChild(t);
  });
}
function checkAnswer(obj,tile){
  const target_=window._target;
  const correct=nameOf(obj)===nameOf(target_);
  if(correct){
    score++;challengeCorrect++;updateScore();
    tile.classList.add('success');
    const praise=lang==='pt'?['Muito bem!','Incrível!','Parabéns!','Que lindo!','Show de bola!','Arrasou!']:['Well done!','Amazing!','Fantastic!','Great job!','Superstar!','Brilliant!'];
    speak(rand(praise));showFeedback('🌟');confetti();setTimeout(nextChallengeQ,1400);
  } else {
    tile.classList.add('wrong-ans');speak(lang==='pt'?'Tente de novo, Benício!':'Try again, Benicio!');showFeedback('💪');setTimeout(()=>tile.classList.remove('wrong-ans'),400);
  }
}
function showEnd(){
  show('end');updateScore();
  const pct=Math.round(challengeCorrect/challengeTotal*100);
  let icon,title,sub;
  if(pct===100){icon='🏆';title=lang==='pt'?'Perfeito, Benício!':'Perfect, Benicio!';sub=lang==='pt'?`${challengeCorrect} de ${challengeTotal} certas! Você é incrível!`:`${challengeCorrect} of ${challengeTotal} correct! You are amazing!`}
  else if(pct>=60){icon='⭐';title=lang==='pt'?'Muito bem!':'Great job!';sub=lang==='pt'?`${challengeCorrect} de ${challengeTotal} certas! Continue assim!`:`${challengeCorrect} of ${challengeTotal} correct! Keep it up!`}
  else{icon='💪';title=lang==='pt'?'Boa tentativa!':'Good try!';sub=lang==='pt'?`${challengeCorrect} de ${challengeTotal} certas! Você consegue!`:`${challengeCorrect} of ${challengeTotal} correct! You can do it!`}
  $('endIcon').textContent=icon;$('endTitle').textContent=title;$('endSub').textContent=sub;
  speak(title+' '+sub);if(pct>=60)confetti();
}
goHome();
</script>
